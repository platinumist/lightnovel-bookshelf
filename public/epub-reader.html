<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EPUB 阅读 · platinumist</title><link rel="stylesheet" href="./reader.css"><link rel="stylesheet" href="./epub-reader.css"><script defer src="./vendor/jszip.min.js"></script><script defer src="./vendor/epub.min.js"></script><script type="module" src="./epub-reader.js"></script></head>
