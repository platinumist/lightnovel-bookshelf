<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在线阅读 · platinumist</title><link rel="stylesheet" href="./reader.css"><script type="module" src="./reader.js"></script></head>
<body>
<header><a href="./">← 返回书架</a><span id="book-title">在线阅读</span><button id="theme" aria-pressed="false">夜间</button></header>
<main><aside aria-label="阅读设置"><label for="chapters">目录</label><select id="chapters" disabled></select><label for="font-size">字号</label><select id="font-size"><option value="18">小</option><option value="20" selected>中</option><option value="24">大</option></select><span id="progress">进度仅保存在当前浏览器</span></aside>
<p id="message" role="status">正在加载…</p><button id="retry" hidden>重试</button>
<article id="article" hidden><h1 id="chapter-title" tabindex="-1"></h1><div id="content"></div></article>
<nav aria-label="章节导航"><button id="prev" disabled>上一章</button><span id="chapter-count"></span><button id="next" disabled>下一章</button></nav>
</main></body></html>
